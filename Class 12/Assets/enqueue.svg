<svg width="100%" viewBox="-20 -3 590 857" role="img" xmlns="http://www.w3.org/2000/svg" style="background-color: #ffffff;">
<title>Enqueue operation in a queue, six-stage sequence</title>
<desc>Diagram showing six stages of queue enqueue operations on a queue of capacity 5: empty queue, then after enqueueing 12, 45, 78, and 33. The final stage shows an attempted enqueue(90) operation resulting in a Queue Overflow error. Rear marks the insertion end on the left; the Front pointer marks the oldest element still in the queue, the next one that would be dequeued.</desc>

<defs>
<marker id="arrowhead" markerWidth="10" markerHeight="10" refX="3" refY="3" orient="auto" markerUnits="userSpaceOnUse">
<path d="M 0 0 L 6 3 L 0 6 Z" fill="rgb(11,11,11)"/>
</marker>
</defs>

<!-- Background -->
<rect x="-20" y="-3" width="590" height="880" fill="#ffffff"/>

<!-- ============ STAGE 1: Empty Queue ============ -->
<text x="295" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="rgb(11,11,11)">Empty Queue(Rear =  -1, Front = -1)</text>

<rect x="170" y="60" width="50" height="40" rx="4" fill="none" stroke="rgb(10,10,10)" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="220" y="60" width="50" height="40" rx="4" fill="none" stroke="rgb(10,10,10)" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="270" y="60" width="50" height="40" rx="4" fill="none" stroke="rgb(10,10,10)" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="320" y="60" width="50" height="40" rx="4" fill="none" stroke="rgb(10,10,10)" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="370" y="60" width="50" height="40" rx="4" fill="none" stroke="rgb(10,10,10)" stroke-width="1" stroke-dasharray="4 4"/>

<line x1="280" y1="102" x2="280" y2="148" stroke="rgb(11,11,11)" stroke-width="1.5" marker-end="url(#arrowhead)"/>
<text x="288" y="130" text-anchor="start" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="rgb(11,11,11)">enqueue(12)</text>

<!-- ============ STAGE 2: after enqueue(12) ============ -->
<text x="150" y="175" text-anchor="end" dominant-baseline="central" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="rgb(130,114,0)">Front=0</text>
<rect x="170" y="155" width="50" height="40" rx="4" fill="rgb(255,249,91)" stroke="rgb(8,8,8)" stroke-width="1"/>
<text x="195" y="175" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="rgb(5,5,5)">12</text>
<rect x="220" y="155" width="50" height="40" rx="4" fill="none" stroke="rgb(10,10,10)" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="270" y="155" width="50" height="40" rx="4" fill="none" stroke="rgb(10,10,10)" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="320" y="155" width="50" height="40" rx="4" fill="none" stroke="rgb(10,10,10)" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="370" y="155" width="50" height="40" rx="4" fill="none" stroke="rgb(10,10,10)" stroke-width="1" stroke-dasharray="4 4"/>
<text x="195" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="rgb(130,114,0)">Rear=0</text>

<line x1="280" y1="197" x2="280" y2="243" stroke="rgb(11,11,11)" stroke-width="1.5" marker-end="url(#arrowhead)"/>
<text x="288" y="225" text-anchor="start" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="rgb(11,11,11)">enqueue(45)</text>

<!-- ============ STAGE 3: after enqueue(45) ============ -->
<rect x="170" y="250" width="50" height="40" rx="4" fill="rgb(153,217,234)" stroke="rgb(8,8,8)" stroke-width="1"/>
<text x="195" y="270" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="rgb(5,5,5)">12</text>
<text x="150" y="270" text-anchor="end" dominant-baseline="central" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="rgb(28,114,138)">Front=0</text>
<text x="245" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="rgb(20,120,30)">Rear=1</text>

<rect x="220" y="250" width="50" height="40" rx="4" fill="rgb(30,222,38)" stroke="rgb(8,8,8)" stroke-width="1"/>
<text x="245" y="270" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="rgb(5,5,5)">45</text>
<rect x="270" y="250" width="50" height="40" rx="4" fill="none" stroke="rgb(10,10,10)" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="320" y="250" width="50" height="40" rx="4" fill="none" stroke="rgb(10,10,10)" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="370" y="250" width="50" height="40" rx="4" fill="none" stroke="rgb(10,10,10)" stroke-width="1" stroke-dasharray="4 4"/>

<line x1="280" y1="292" x2="280" y2="338" stroke="rgb(11,11,11)" stroke-width="1.5" marker-end="url(#arrowhead)"/>
<text x="288" y="320" text-anchor="start" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="rgb(11,11,11)">enqueue(78)</text>

<!-- ============ STAGE 4: after enqueue(78) ============ -->
<rect x="170" y="345" width="50" height="40" rx="4" fill="rgb(153,217,234)" stroke="rgb(8,8,8)" stroke-width="1"/>
<text x="195" y="365" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="rgb(5,5,5)">12</text>
<text x="150" y="365" text-anchor="end" dominant-baseline="central" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="rgb(28,114,138)">Front=0</text>
<text x="307" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="rgb(20,120,30)">Rear=2</text>

<rect x="220" y="345" width="50" height="40" rx="4" fill="rgb(68, 68, 65)" stroke="rgb(5,5,5)" stroke-width="0.5"/>
<text x="245" y="365" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="rgb(240,240,235)">45</text>

<rect x="270" y="345" width="50" height="40" rx="4" fill="rgb(30,222,38)" stroke="rgb(8,8,8)" stroke-width="1"/>
<text x="295" y="365" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="rgb(5,5,5)">78</text>
<rect x="320" y="345" width="50" height="40" rx="4" fill="none" stroke="rgb(10,10,10)" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="370" y="345" width="50" height="40" rx="4" fill="none" stroke="rgb(10,10,10)" stroke-width="1" stroke-dasharray="4 4"/>

<line x1="280" y1="387" x2="280" y2="433" stroke="rgb(11,11,11)" stroke-width="1.5" marker-end="url(#arrowhead)"/>
<text x="288" y="415" text-anchor="start" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="rgb(11,11,11)">enqueue(33)</text>

<!-- ============ STAGE 5: after enqueue(33) ============ -->
<rect x="170" y="440" width="50" height="40" rx="4" fill="rgb(153,217,234)" stroke="rgb(8,8,8)" stroke-width="1"/>
<text x="195" y="460" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="rgb(5,5,5)">12</text>
<text x="150" y="460" text-anchor="end" dominant-baseline="central" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="rgb(28,114,138)">Front=0</text>
<text x="345" y="435" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="rgb(20,120,30)">Rear=3</text>

<rect x="220" y="440" width="50" height="40" rx="4" fill="rgb(68, 68, 65)" stroke="rgb(5,5,5)" stroke-width="0.5"/>
<text x="245" y="460" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="rgb(240,240,235)">45</text>

<rect x="270" y="440" width="50" height="40" rx="4" fill="rgb(68, 68, 65)" stroke="rgb(5,5,5)" stroke-width="0.5"/>
<text x="295" y="460" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="rgb(240,240,235)">78</text>

<rect x="320" y="440" width="50" height="40" rx="4" fill="rgb(30,222,38)" stroke="rgb(8,8,8)" stroke-width="1"/>
<text x="345" y="460" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="rgb(5,5,5)">33</text>
<rect x="370" y="440" width="50" height="40" rx="4" fill="none" stroke="rgb(10,10,10)" stroke-width="1" stroke-dasharray="4 4"/>

<line x1="280" y1="482" x2="280" y2="528" stroke="rgb(11,11,11)" stroke-width="1.5" marker-end="url(#arrowhead)"/>
<text x="288" y="510" text-anchor="start" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="rgb(11,11,11)">enqueue(90)</text>

<!-- ============ STAGE 6: overflow attempt ============ -->
<rect x="170" y="535" width="50" height="40" rx="4" fill="rgb(153,217,234)" stroke="rgb(8,8,8)" stroke-width="1"/>
<text x="195" y="555" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="rgb(5,5,5)">12</text>
<text x="150" y="555" text-anchor="end" dominant-baseline="central" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="rgb(28,114,138)">Front=0</text>
<text x="395" y="530" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="rgb(20,120,30)">Rear=4</text>

<rect x="220" y="535" width="50" height="40" rx="4" fill="rgb(68, 68, 65)" stroke="rgb(5,5,5)" stroke-width="0.5"/>
<text x="245" y="555" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="rgb(240,240,235)">45</text>

<rect x="270" y="535" width="50" height="40" rx="4" fill="rgb(68, 68, 65)" stroke="rgb(5,5,5)" stroke-width="0.5"/>
<text x="295" y="555" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="rgb(240,240,235)">78</text>

<rect x="320" y="535" width="50" height="40" rx="4" fill="rgb(68, 68, 65)" stroke="rgb(5,5,5)" stroke-width="0.5"/>
<text x="345" y="555" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="rgb(240,240,235)">33</text>

<rect x="370" y="535" width="50" height="40" rx="4" fill="rgb(30,222,38)" stroke="rgb(8,8,8)" stroke-width="1"/>
<text x="395" y="555" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="rgb(5,5,5)">90</text>

<line x1="280" y1="580" x2="280" y2="625" stroke="rgb(11,11,11)" stroke-width="1.5" marker-end="url(#arrowhead)"/>
<text x="288" y="605" text-anchor="start" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="rgb(11,11,11)">enqueue(9)</text>

<!-- error callout -->
<rect x="198" y="630" width="160" height="75" rx="4" fill="none" stroke="rgb(222,40,40)" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="280" y="655" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="750" fill="rgb(222,40,40)">Error: Overflow!</text>
<text x="280" y="678" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="rgb(222,40,40)">Can't enqueue to a</text>
<text x="280" y="694" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="rgb(222,40,40)">full queue.</text>

<!-- ============ Footer ============ -->
<text x="280" y="800" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.5" font-weight="600" fill="rgb(50,50,50)">Front=oldest element still queued, next to be dequeued(data retrieval end)</text>
<text x="280" y="823" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.5" font-weight="600" fill="rgb(50,50,50)">Rear=newest element added(insertion end)</text>

<g>
<path d="M 170,736 L 390,736 Q 393,736 393,739 L 393,765 Q 393,768 390,768 L 170,768 Q 167,768 167,765 L 167,739 Q 167,736 170,736 Z" fill="rgb(228,255,26)" fill-opacity="0.6"/>
<path fill-rule="evenodd" fill="rgb(200,180,40)" fill-opacity="0.9" d="
M 170,736 L 390,736 Q 393,736 393,739 L 393,765 Q 393,768 390,768 L 170,768 Q 167,768 167,765 L 167,739 Q 167,736 170,736 Z
M 170,737 L 390,737 Q 392,737 392,739 L 392,765 Q 392,767 390,767 L 170,767 Q 168,767 168,765 L 168,739 Q 168,737 170,737 Z
"/>
</g>
<text x="280" y="757" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="rgb(32,31,28)">Let, Queue Limit = 5</text>

</svg>
