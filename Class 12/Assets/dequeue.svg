<svg width="100%" viewBox="-20 -3 590 805" role="img" xmlns="http://www.w3.org/2000/svg" style="background-color: #ffffff;">
<title>Dequeue operation in a queue, six-stage sequence</title>
<desc>Diagram showing six stages of queue dequeue operations starting from a full queue of capacity 5: elements 12, 45, 78, 33, and 90. Elements are dequeued one by one until the queue is empty. The final stage shows an attempted dequeue() operation resulting in a Queue Underflow error. Front points to the element to be dequeued; Rear marks the insertion end.</desc>

<defs>
<marker id="arrowhead" markerWidth="10" markerHeight="10" refX="3" refY="3" orient="auto" markerUnits="userSpaceOnUse">
<path d="M 0 0 L 6 3 L 0 6 Z" fill="rgb(11,11,11)"/>
</marker>
</defs>

<!-- Background -->
<rect x="-20" y="-3" width="590" height="805" fill="#ffffff"/>

<!-- ============ STAGE 1: Full Queue ============ -->
<text x="295" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="rgb(11,11,11)">Full Queue</text>
<text x="430" y="365" text-anchor="start" dominant-baseline="central" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="rgb(20,120,30)">Rear=4</text>
<text x="150" y="80" text-anchor="end" dominant-baseline="central" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="rgb(28,114,138)">Front=0</text>
<text x="430" y="80" text-anchor="start" dominant-baseline="central" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="rgb(20,120,30)">Rear=4</text>

<!-- Box 0 (Front) -->
<rect x="170" y="60" width="50" height="40" rx="4" fill="rgb(153,217,234)" stroke="rgb(8,8,8)" stroke-width="1"/>
<text x="195" y="80" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="rgb(5,5,5)">12</text>
<!-- Box 1..4 (Normal) -->
<rect x="220" y="60" width="50" height="40" rx="4" fill="rgb(68, 68, 65)" stroke="rgb(5,5,5)" stroke-width="0.5"/>
<text x="245" y="80" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="rgb(240,240,235)">45</text>
<rect x="270" y="60" width="50" height="40" rx="4" fill="rgb(68, 68, 65)" stroke="rgb(5,5,5)" stroke-width="0.5"/>
<text x="295" y="80" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="rgb(240,240,235)">78</text>
<rect x="320" y="60" width="50" height="40" rx="4" fill="rgb(68, 68, 65)" stroke="rgb(5,5,5)" stroke-width="0.5"/>
<text x="345" y="80" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="rgb(240,240,235)">33</text>
<rect x="370" y="60" width="50" height="40" rx="4" fill="rgb(30,222,38)" stroke="rgb(8,8,8)" stroke-width="1"/>
<text x="395" y="80" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="rgb(5,5,5)">90</text>

<line x1="280" y1="102" x2="280" y2="148" stroke="rgb(11,11,11)" stroke-width="1.5" marker-end="url(#arrowhead)"/>
<text x="288" y="130" text-anchor="start" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="rgb(11,11,11)">dequeue()</text>

<!-- ============ STAGE 2 ============ -->
<text x="150" y="175" text-anchor="end" dominant-baseline="central" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="rgb(28,114,138)">Front=1</text>
<text x="430" y="175" text-anchor="start" dominant-baseline="central" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="rgb(20,120,30)">Rear=4</text>

<!-- Box 0 (Empty) -->
<rect x="170" y="155" width="50" height="40" rx="4" fill="none" stroke="rgb(10,10,10)" stroke-width="1" stroke-dasharray="4 4"/>
<!-- Box 1 (Front) -->
<rect x="220" y="155" width="50" height="40" rx="4" fill="rgb(153,217,234)" stroke="rgb(8,8,8)" stroke-width="1"/>
<text x="245" y="175" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="rgb(5,5,5)">45</text>
<!-- Box 2..4 -->
<rect x="270" y="155" width="50" height="40" rx="4" fill="rgb(68, 68, 65)" stroke="rgb(5,5,5)" stroke-width="0.5"/>
<text x="295" y="175" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="rgb(240,240,235)">78</text>
<rect x="320" y="155" width="50" height="40" rx="4" fill="rgb(68, 68, 65)" stroke="rgb(5,5,5)" stroke-width="0.5"/>
<text x="345" y="175" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="rgb(240,240,235)">33</text>
<rect x="370" y="155" width="50" height="40" rx="4" fill="rgb(30,222,38)" stroke="rgb(8,8,8)" stroke-width="1"/>
<text x="395" y="175" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="rgb(5,5,5)">90</text>

<line x1="280" y1="197" x2="280" y2="243" stroke="rgb(11,11,11)" stroke-width="1.5" marker-end="url(#arrowhead)"/>
<text x="288" y="225" text-anchor="start" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="rgb(11,11,11)">dequeue()</text>

<!-- ============ STAGE 3 ============ -->
<text x="150" y="270" text-anchor="end" dominant-baseline="central" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="rgb(28,114,138)">Front=2</text>
<text x="430" y="270" text-anchor="start" dominant-baseline="central" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="rgb(20,120,30)">Rear=4</text>

<rect x="170" y="250" width="50" height="40" rx="4" fill="none" stroke="rgb(10,10,10)" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="220" y="250" width="50" height="40" rx="4" fill="none" stroke="rgb(10,10,10)" stroke-width="1" stroke-dasharray="4 4"/>
<!-- Box 2 (Front) -->
<rect x="270" y="250" width="50" height="40" rx="4" fill="rgb(153,217,234)" stroke="rgb(8,8,8)" stroke-width="1"/>
<text x="295" y="270" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="rgb(5,5,5)">78</text>
<!-- Box 3..4 -->
<rect x="320" y="250" width="50" height="40" rx="4" fill="rgb(68, 68, 65)" stroke="rgb(5,5,5)" stroke-width="0.5"/>
<text x="345" y="270" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="rgb(240,240,235)">33</text>
<rect x="370" y="250" width="50" height="40" rx="4" fill="rgb(30,222,38)" stroke="rgb(8,8,8)" stroke-width="1"/>
<text x="395" y="270" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="rgb(5,5,5)">90</text>

<line x1="280" y1="292" x2="280" y2="338" stroke="rgb(11,11,11)" stroke-width="1.5" marker-end="url(#arrowhead)"/>
<text x="288" y="320" text-anchor="start" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="rgb(11,11,11)">dequeue()</text>

<!-- ============ STAGE 4 ============ -->
<text x="150" y="365" text-anchor="end" dominant-baseline="central" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="rgb(28,114,138)">Front=3</text>
<text x="430" y="365" text-anchor="start" dominant-baseline="central" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="rgb(20,120,30)">Rear=4</text>

<rect x="170" y="345" width="50" height="40" rx="4" fill="none" stroke="rgb(10,10,10)" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="220" y="345" width="50" height="40" rx="4" fill="none" stroke="rgb(10,10,10)" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="270" y="345" width="50" height="40" rx="4" fill="none" stroke="rgb(10,10,10)" stroke-width="1" stroke-dasharray="4 4"/>
<!-- Box 3 (Front) -->
<rect x="320" y="345" width="50" height="40" rx="4" fill="rgb(153,217,234)" stroke="rgb(8,8,8)" stroke-width="1"/>
<text x="345" y="365" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="rgb(5,5,5)">33</text>
<!-- Box 4 -->
<rect x="370" y="345" width="50" height="40" rx="4" fill="rgb(30,222,38)" stroke="rgb(8,8,8)" stroke-width="1"/>
<text x="395" y="365" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="rgb(5,5,5)">90</text>

<line x1="280" y1="387" x2="280" y2="433" stroke="rgb(11,11,11)" stroke-width="1.5" marker-end="url(#arrowhead)"/>
<text x="288" y="415" text-anchor="start" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="rgb(11,11,11)">dequeue()</text>

<!-- ============ STAGE 5 ============ -->
<text x="150" y="460" text-anchor="end" dominant-baseline="central" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="rgb(130,114,0)">Front=4</text>
<text x="430" y="460" text-anchor="start" dominant-baseline="central" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="rgb(130,114,0)">Rear=4</text>

<rect x="170" y="440" width="50" height="40" rx="4" fill="none" stroke="rgb(10,10,10)" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="220" y="440" width="50" height="40" rx="4" fill="none" stroke="rgb(10,10,10)" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="270" y="440" width="50" height="40" rx="4" fill="none" stroke="rgb(10,10,10)" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="320" y="440" width="50" height="40" rx="4" fill="none" stroke="rgb(10,10,10)" stroke-width="1" stroke-dasharray="4 4"/>
<!-- Box 4 (Front) -->
<rect x="370" y="440" width="50" height="40" rx="4" fill="rgb(255,249,91)" stroke="rgb(8,8,8)" stroke-width="1"/>
<text x="395" y="460" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="rgb(5,5,5)">90</text>

<line x1="280" y1="482" x2="280" y2="528" stroke="rgb(11,11,11)" stroke-width="1.5" marker-end="url(#arrowhead)"/>
<text x="288" y="510" text-anchor="start" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="rgb(11,11,11)">dequeue()</text>

<!-- ============ STAGE 6: Empty Queue ============ -->
<text x="150" y="555" text-anchor="end" dominant-baseline="central" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="rgb(28,114,138)">Front=-1</text>
<text x="430" y="555" text-anchor="start" dominant-baseline="central" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="rgb(20,120,30)">Rear=-1</text>

<rect x="170" y="535" width="50" height="40" rx="4" fill="none" stroke="rgb(10,10,10)" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="220" y="535" width="50" height="40" rx="4" fill="none" stroke="rgb(10,10,10)" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="270" y="535" width="50" height="40" rx="4" fill="none" stroke="rgb(10,10,10)" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="320" y="535" width="50" height="40" rx="4" fill="none" stroke="rgb(10,10,10)" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="370" y="535" width="50" height="40" rx="4" fill="none" stroke="rgb(10,10,10)" stroke-width="1" stroke-dasharray="4 4"/>

<line x1="280" y1="580" x2="280" y2="625" stroke="rgb(11,11,11)" stroke-width="1.5" marker-end="url(#arrowhead)"/>
<text x="288" y="605" text-anchor="start" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="rgb(11,11,11)">dequeue()</text>

<!-- error callout -->
<rect x="198" y="630" width="160" height="75" rx="4" fill="none" stroke="rgb(222,40,40)" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="280" y="655" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="750" fill="rgb(222,40,40)">Error: Underflow!</text>
<text x="280" y="678" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="rgb(222,40,40)">Can't dequeue from</text>
<text x="280" y="694" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="rgb(222,40,40)">an empty queue.</text>

<text x="280" y="743" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="rgb(50,50,50)">Front = index of oldest element(next to be dequeued)</text>
<text x="280" y="766" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="rgb(50,50,50)">Rear = index of newest element</text>
</svg>
